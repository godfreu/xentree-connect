private = { ignore = true }
# Input for `cargo about generate about.hbs`: the third-party notices shipped
# with every release (THIRD_PARTY_LICENSES.md, and `xentree-connect licenses`).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "MPL-2.0",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
]
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Dev-dependencies and build-only tooling are not shipped in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
workarounds = ["ring"]
