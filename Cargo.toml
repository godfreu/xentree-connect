[package]
name = "xentree-connect"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Xentree Connect: key management and assertion signing"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
console = "0.15"
directories = "5"
httpdate = "1"
inquire = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
ring = "0.17"
rsntp = { version = "4", default-features = false, features = ["async"] }
rust-i18n = "3"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "net", "io-util", "signal", "sync"] }
tower-http = { version = "0.6", features = ["limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
uuid = { version = "1", default-features = false, features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
regex = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# 0.6.5 uses let-chains (needs rustc 1.88); lift the cap when the toolchain moves.
wiremock = ">=0.6.0, <0.6.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
