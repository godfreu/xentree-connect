[package]
name = "xentree-connect"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Xentree Connect: key management and assertion signing"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
ring = "0.17"
rsntp = { version = "4", default-features = false, features = ["async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "net", "io-util"] }
tracing = "0.1"
uuid = { version = "1", default-features = false, features = ["v4"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
